name: Integration tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
        image: public.ecr.aws/n0y9d4d4/marinade.finance/solana-test-validator:latest
        options: --user root
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        node-version: [20]

    steps:
      - name: Link AVM, solana .config, check versions
        run: |
          ln -s /root/.avm $HOME/
          mkdir -p $HOME/.config
          ln -s /root/.config/solana $HOME/.config/
          avm use 0.28.0
          anchor --version
          solana --version


      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install libatomic (required by pnpm binary)
        run: apt-get update && apt-get install -y --no-install-recommends libatomic1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - name: Install, build and run integration tests
        timeout-minutes: 5
        run: |
          pnpm install
          pnpm build
          pnpm test:integration
        env:
          CI: true
